        // Utility functions
        const formatBid = (bid) => {
          if (bid === 'Pass') return 'Pass';
          if (bid === 'X') return 'X';
          if (bid === 'XX') return 'XX';
          const suits = { C: '♣', D: '♦', H: '♥', S: '♠' };
          const level = bid.charAt(0);
          const suit = bid.substring(1);
          return suit === 'NT' ? `${level}NT` : `${level}${suits[suit]}`;
        };

        const getNextSeat = (seat) => {
          const seats = ['N', 'E', 'S', 'W'];
          return seats[(seats.indexOf(seat) + 1) % 4];
        };

        const BIDDING_SYSTEMS = {
          acol: {
            id: 'acol',

            majorCardMin: 4,
            nt2Range: [20, 22],
            lengthPoints: false,
            preamble: `BIDDING SYSTEM: Standard English ACOL (UK/Ireland/NZ)
KEY RULES:
- 1NT opening = 12-14 HCP balanced (WEAK no trump)
- Opening 1 of a major suit promises only 4+ cards (NOT 5)
- Raising partner's major requires 4-card support (NOT 3)
- 2NT opening = 20-22 HCP balanced
- Do NOT add length points when valuing your hand`,
          },
          sayc: {
            id: 'sayc',
            name: 'SAYC',
            label: 'Standard American (SAYC)',
            nt1Range: [15, 17],
            majorCardMin: 5,
            nt2Range: [20, 21],
            lengthPoints: true,
            preamble: `BIDDING SYSTEM: Standard American Yellow Card (SAYC)
KEY RULES:
- 1NT opening = 15-17 HCP balanced (STRONG no trump)
- Opening 1 of a major suit promises 5+ cards
- Raising partner's major is acceptable with 3-card support
- 2NT opening = 20-21 HCP balanced
- Add 1 length point for each card above 4 in a suit`,
          }
        };

        const detectSystem = () => {
          const saved = localStorage.getItem('slam-bidding-system');
          if (saved === 'acol' || saved === 'sayc') return saved;
          const host = window.location.hostname;
          if (host.includes('slambridge.ie')) return 'acol';
          if (host.includes('slambridge.us')) return 'sayc';
          const locale = navigator.language || '';
          const acolLocales = ['en-GB', 'en-IE', 'en-NZ'];
          return acolLocales.some(l => locale.startsWith(l)) ? 'acol' : 'sayc';
        };

        const getSystemFlag = (sys) => {
          if (sys === 'sayc') return '\u{1F1FA}\u{1F1F8}';
          const host = window.location.hostname;
          if (host.includes('slambridge.ie')) return '\u{1F1EE}\u{1F1EA}';
          if (host.includes('slambridge.nz')) return '\u{1F1F3}\u{1F1FF}';
          return '\u{1F1EC}\u{1F1E7}';

        // Main App Component
        const App = () => {
          const [currentView, setCurrentView] = useState('home');
          const [selectedModule, setSelectedModule] = useState('ALL');
          const [sessionResults, setSessionResults] = useState([]);
          const [finalScore, setFinalScore] = useState(0);
          const [system, setSystem] = useState(detectSystem());

          const handleSystemChange = (newSystem) => {
            setSystem(newSystem);
            localStorage.setItem('slam-bidding-system', newSystem);
          };

          const handleStartSession = (module) => {
            setSelectedModule(module);
            setSessionResults([]);
            setFinalScore(0);
            setCurrentView('play');
          };

          const handleSessionComplete = (results, score) => {
            setSessionResults(results);
            setFinalScore(score);
            setCurrentView('summary');
          };

          return (
            <div style={{
              minHeight: '100vh',
              background: 'linear-gradient(135deg, #0f1419 0%, #1a2332 100%)',
              color: '#e8edf2',
              padding: '40px 20px'

                <HomeScreen
                  system={system}
                  onSystemChange={handleSystemChange}
                  onStartSession={handleStartSession}
                />

                  selectedModule={selectedModule}
                  system={system}
                  onSessionComplete={handleSessionComplete}

                    alignItems: 'center'
                  }}>
                    <div>
                      <div style={{ fontWeight: '600', marginBottom: '4px' }}>
                        {result.title}
                      </div>
                      <div style={{ fontSize: '14px', color: '#94a3b8' }}>
                        Your bid: {formatBid(result.bid)} {result.correct && '✓'}
                      </div>
                    </div>
                    <div style={{
                      fontSize: '20px',
                      fontWeight: '700',
                      color: result.points === 3 ? '#4ade80' : result.points === 2 ? '#fb923c' : '#f87171'
                    }}>
                      +{result.points}
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ display: 'flex', gap: '16px' }}>
                <a 
                  href="/"
                  style={{
                    flex: 1,
                    background: 'rgba(255, 255, 255, 0.05)',
                    color: '#94a3b8',
                    border: '1px solid rgba(255, 255, 255, 0.1)',
                    borderRadius: '12px',
                    padding: '16px',
                    fontSize: '16px',
                    fontWeight: '600',
                    cursor: 'pointer',
                    textDecoration: 'none',
                    textAlign: 'center',
                    display: 'block'
                  }}
                >
                  ⌂ Main Menu
                </a>
                <button
                  onClick={onNavigateHome}
                  style={{
                    flex: 1,
                    background: 'linear-gradient(135deg, #4ade80 0%, #22d3ee 100%)',
                    color: '#0f1419',
                    border: 'none',
                    borderRadius: '12px',
                    padding: '16px',
                    fontSize: '16px',
                    fontWeight: '600',
                    cursor: 'pointer'
                  }}
                >
                  Play Again
                </button>
              </div>
            </div>
          );
        };

        // Play Session Component
        const PlaySession = ({ selectedModule, system, onSessionComplete, onNavigateHome }) => {
          const filteredScenarios = selectedModule === 'ALL' 
            ? SCENARIOS 
            : SCENARIOS.filter(s => s.module === selectedModule);
          
          const [currentIndex, setCurrentIndex] = useState(0);
          const [sessionResults, setSessionResults] = useState([]);
          const [sessionScore, setSessionScore] = useState(0);
          const [selectedBid, setSelectedBid] = useState(null);
          const [showFeedback, setShowFeedback] = useState(false);
          const [showHints, setShowHints] = useState(false); // Changed to false by default
          const [showThinking, setShowThinking] = useState(false); // NEW: Show auction reasoning toggle

          const currentScenario = filteredScenarios[currentIndex];

          const handleBidSelect = (bid) => {
            if (showFeedback) return;

            setSelectedBid(bid);
            setShowFeedback(true);

            const correctBid = (system === 'acol' && currentScenario.acol_correct_bid)
              ? currentScenario.acol_correct_bid
              : currentScenario.correct_bid;

            let points = 0;
            let correct = false;

            if (bid === correctBid) {
              points = 3;
              correct = true;
            } else if (currentScenario.alternatives && currentScenario.alternatives.includes(bid)) {
              points = 2;
              correct = false;
            }

            const newScore = sessionScore + points;
            setSessionScore(newScore);
            
            const result = {
              scenario: currentScenario.id,
              title: currentScenario.title,
              bid,
              points,
              correct
            };
            
            setSessionResults([...sessionResults, result]);
          };

          const handleNext = () => {
            if (currentIndex < filteredScenarios.length - 1) {
              setCurrentIndex(currentIndex + 1);
              setSelectedBid(null);
              setShowFeedback(false);
            } else {
              onSessionComplete([...sessionResults], sessionScore);
            }
          };

          // Check if bid is legal
          const isBidLegal = (bidValue) => {
            if (bidValue === 'Pass' || bidValue === 'X') return true;
            
            const lastBid = currentScenario.auction
              .slice()
              .reverse()
              .find(b => b.bid !== 'Pass' && b.bid !== 'X' && b.bid !== '?');
            
            if (!lastBid || lastBid.bid === '?') return true;
            
            const getBidValue = (b) => {
              if (b === 'Pass' || b === 'X') return -1;
              const level = parseInt(b.charAt(0));
              const suitOrder = { 'C': 0, 'D': 1, 'H': 2, 'S': 3, 'NT': 4 };
              const suit = b.substring(1);
              return level * 5 + (suitOrder[suit] || 0);
            };
            
            return getBidValue(bidValue) > getBidValue(lastBid.bid);
          };

          return (
            <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
              {/* Header */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '32px' }}>
                <div style={{ display: 'flex', gap: '16px', alignItems: 'center' }}>
                  <a href="/" style={{
                    background: 'none',
                    border: 'none',
                    color: '#94a3b8',
                    textDecoration: 'none',
                    fontSize: '14px',
                    cursor: 'pointer'
                  }}>
                    ⌂ Main Menu
                  </a>
                  <span style={{ color: '#475569' }}>|</span>
                  <button onClick={onNavigateHome} style={{
                    background: 'none',
                    border: 'none',
                    color: '#94a3b8',
                    cursor: 'pointer',
                    fontSize: '14px'
                  }}>
                    ← Module Select
                  </button>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                  <button 
                    onClick={() => setShowHints(!showHints)}
                    style={{
                      background: showHints ? 'rgba(34, 211, 238, 0.2)' : 'rgba(255, 255, 255, 0.05)',
                      border: `1px solid ${showHints ? 'rgba(34, 211, 238, 0.4)' : 'rgba(255, 255, 255, 0.1)'}`,
                      borderRadius: '8px',
                      padding: '8px 16px',
                      color: showHints ? '#22d3ee' : '#94a3b8',
                      fontSize: '14px',
                      fontWeight: '600',
                      cursor: 'pointer',
                      transition: 'all 0.2s'
                    }}
                  >
                    💡 {showHints ? 'Hints On' : 'Hints Off'}
                  </button>
                  <button 
                    onClick={() => setShowThinking(!showThinking)}
                    style={{
                      background: showThinking ? 'rgba(251, 146, 60, 0.2)' : 'rgba(255, 255, 255, 0.05)',
                      border: `1px solid ${showThinking ? 'rgba(251, 146, 60, 0.4)' : 'rgba(255, 255, 255, 0.1)'}`,
                      borderRadius: '8px',
                      padding: '8px 16px',
                      color: showThinking ? '#fb923c' : '#94a3b8',
                      fontSize: '14px',
                      fontWeight: '600',
                      cursor: 'pointer',
                      transition: 'all 0.2s'
                    }}
                  >
                    🧠 {showThinking ? 'Thinking On' : 'Thinking Off'}
                  </button>
                  <span style={{
                    fontSize: '12px',
                    color: '#4ade80',
                    border: '1px solid rgba(74,222,128,0.3)',
                    borderRadius: '4px',
                    padding: '2px 8px'
                  }}>
                    {BIDDING_SYSTEMS[system].name}
                  </span>
                  <div style={{ fontSize: '18px', fontWeight: '600' }}>
                    Scenario {currentIndex + 1}/{filteredScenarios.length} • Score: {sessionScore}
                  </div>
                </div>
              </div>

              {/* Scenario Title */}
              <h2 style={{
                fontSize: '28px',
                fontWeight: '700',
                marginBottom: '24px',
                textAlign: 'center'
              }}>
                {currentScenario.title}
              </h2>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', marginBottom: '24px' }}>
                {/* Left: Your Hand */}
                <div style={{
                  background: 'rgba(255, 255, 255, 0.03)',
                  border: '1px solid rgba(255, 255, 255, 0.08)',
                  borderRadius: '16px',
                  padding: '24px'
                }}>
                  <h3 style={{ marginBottom: '16px', fontSize: '18px' }}>
                    Your Hand ({currentScenario.your_seat})
                  </h3>
                  <HandDisplay hand={currentScenario.your_hand} />
                  
                  {showHints && (
                    <div style={{
                      marginTop: '20px',
                      padding: '16px',
                      background: 'rgba(34, 211, 238, 0.1)',
                      border: '1px solid rgba(34, 211, 238, 0.3)',
                      borderRadius: '8px',
                      fontSize: '14px',
                      color: '#22d3ee'
                    }}>
                      💡 {(system === 'acol' && currentScenario.acol_teaching_point) ? currentScenario.acol_teaching_point : currentScenario.teaching_point}
                    </div>
                  )}
                </div>

                {/* Right: Auction */}
                <div style={{
                  background: 'rgba(255, 255, 255, 0.03)',
                  border: '1px solid rgba(255, 255, 255, 0.08)',
                  borderRadius: '16px',
                  padding: '24px'
                }}>
                  <h3 style={{ marginBottom: '16px', fontSize: '18px' }}>Auction</h3>
                  
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {currentScenario.auction.map((bid, i) => (
                      <div key={i} style={{
                        padding: '12px',
                        background: bid.seat === currentScenario.your_seat ? 'rgba(74, 222, 128, 0.1)' : 'rgba(255, 255, 255, 0.05)',
                        border: `1px solid ${bid.seat === currentScenario.your_seat ? 'rgba(74, 222, 128, 0.3)' : 'rgba(255, 255, 255, 0.1)'}`,
                        borderRadius: '8px',
                        display: 'flex',
                        gap: '12px',
                        alignItems: 'center'
                      }}>
                        <div style={{ fontWeight: '700', minWidth: '24px', color: '#94a3b8' }}>
                          {bid.seat}
                        </div>
                        <div style={{ fontSize: '20px', fontWeight: '700', minWidth: '60px' }}>
                          {bid.bid === '?' ? '?' : formatBid(bid.bid)}
                        </div>
                        {showThinking && bid.explanation && (
                          <div style={{ fontSize: '13px', color: '#94a3b8', fontStyle: 'italic' }}>
                            {bid.explanation}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Feedback */}
              {showFeedback && (
                <FeedbackPanel
                  scenario={currentScenario}
                  selectedBid={selectedBid}
                  system={system}
                  onNext={handleNext}
                  isLastScenario={currentIndex === filteredScenarios.length - 1}
                />
              )}

              {/* Bidding Interface */}
              {!showFeedback && (
                <BiddingInterface 
                  onBidSelect={handleBidSelect}
                  isBidLegal={isBidLegal}
                />
              )}
            </div>
          );
        };

        // Hand Display Component
        const HandDisplay = ({ hand }) => {
          const suits = [
            { symbol: '♠', name: 'S', color: '#e2e8f0', bgColor: 'rgba(15, 20, 25, 0.4)', holding: hand.S },
            { symbol: '♥', name: 'H', color: '#f87171', bgColor: 'rgba(248, 113, 113, 0.1)', holding: hand.H },
            { symbol: '♦', name: 'D', color: '#fb923c', bgColor: 'rgba(251, 146, 60, 0.1)', holding: hand.D },
            { symbol: '♣', name: 'C', color: '#4ade80', bgColor: 'rgba(74, 222, 128, 0.1)', holding: hand.C }
          ];

          return (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
              {suits.map(suit => (
                <div key={suit.name} style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                  <div style={{
                    width: '32px',
                    height: '32px',
                    borderRadius: '6px',
                    background: suit.bgColor,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: '20px',
                    color: suit.color,
                    fontWeight: '700'
                  }}>
                    {suit.symbol}
                  </div>
                  <div style={{
                    fontSize: '18px',
                    fontWeight: '600',
                    letterSpacing: '0.08em',
                    color: '#e8edf2'
                  }}>
                    {suit.holding}
                  </div>
                </div>
              ))}
            </div>
          );
        };

        // Feedback Panel Component
        const FeedbackPanel = ({ scenario, selectedBid, system, onNext, isLastScenario }) => {
          const correctBid = (system === 'acol' && scenario.acol_correct_bid)
            ? scenario.acol_correct_bid
            : scenario.correct_bid;
          const isCorrect = selectedBid === correctBid;
          const isAlternative = scenario.alternatives && scenario.alternatives.includes(selectedBid);

          const config = isCorrect 
            ? { title: '✓ Excellent!', color: '#4ade80', points: 3 }
            : isAlternative
            ? { title: '~ Good Alternative', color: '#fb923c', points: 2 }
            : { title: '✗ Not Recommended', color: '#f87171', points: 0 };

          return (
            <div style={{
              background: `${config.color}20`,
              border: `2px solid ${config.color}40`,
              borderRadius: '16px',
              padding: '32px'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '24px' }}>
                <div>
                  <h3 style={{ fontSize: '24px', fontWeight: '700', margin: '0 0 8px 0', color: config.color }}>
                    {config.title}
                  </h3>
                  <div style={{ fontSize: '16px', color: '#cbd5e1' }}>
                    You bid: <span style={{ fontWeight: '600' }}>{formatBid(selectedBid)}</span>
                    {!isCorrect && (
                      <> • Best: <span style={{ fontWeight: '600', color: config.color }}>{formatBid(correctBid)}</span></>
                    )}
                  </div>
                </div>
                <div style={{
                  background: `${config.color}40`,
                  borderRadius: '8px',
                  padding: '8px 16px',
                  fontSize: '20px',
                  fontWeight: '700',
                  color: config.color
                }}>
                  +{config.points}
                </div>
              </div>

              <div style={{
                background: 'rgba(255, 255, 255, 0.05)',
                borderRadius: '12px',
                padding: '20px',
                marginBottom: '20px'
              }}>
                <h4 style={{ fontSize: '14px', marginBottom: '12px', color: '#94a3b8' }}>
                  EXPLANATION
                </h4>
                {scenario.explanation.map((point, i) => (
                  <p key={i} style={{ margin: '0 0 8px 0', fontSize: '15px', lineHeight: '1.6' }}>
                    • {point}
                  </p>
                ))}
              </div>

              <button
                onClick={onNext}
                style={{
                  width: '100%',
                  background: 'linear-gradient(135deg, #4ade80 0%, #22d3ee 100%)',
                  color: '#0f1419',
                  border: 'none',
                  borderRadius: '12px',
                  padding: '14px 24px',
                  fontSize: '16px',
                  fontWeight: '600',
                  cursor: 'pointer'
                }}
              >
                {isLastScenario ? 'View Summary' : 'Next Scenario'} →
              </button>
            </div>
          );
        };

        // Bidding Interface Component
        const BiddingInterface = ({ onBidSelect, isBidLegal }) => {
          return (
            <div style={{
              background: 'rgba(255, 255, 255, 0.03)',
              border: '1px solid rgba(255, 255, 255, 0.08)',
              borderRadius: '16px',
              padding: '24px'
            }}>
              <h3 style={{ marginBottom: '20px', textAlign: 'center', fontSize: '18px' }}>
                Your Turn - What's your bid?
              </h3>
              <div style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(auto-fill, minmax(70px, 1fr))',
                gap: '8px'
              }}>
                {BID_OPTIONS.map(bid => (
                  <BidButton
                    key={bid.value}
                    bid={bid}
                    onClick={() => onBidSelect(bid.value)}
                    disabled={!isBidLegal(bid.value)}
                  />
                ))}
              </div>
            </div>
          );
        };

        // Bid Button Component
        const BidButton = ({ bid, onClick, disabled = false }) => {
          const [isHovered, setIsHovered] = useState(false);

          const getColorScheme = (color) => {
            const schemes = {
              gray: { bg: 'rgba(148, 163, 184, 0.1)', border: 'rgba(148, 163, 184, 0.3)', text: '#cbd5e1' },
              club: { bg: 'rgba(22, 101, 52, 0.2)', border: 'rgba(74, 222, 128, 0.4)', text: '#4ade80' },
              diamond: { bg: 'rgba(234, 88, 12, 0.2)', border: 'rgba(251, 146, 60, 0.4)', text: '#fb923c' },
              heart: { bg: 'rgba(220, 38, 38, 0.2)', border: 'rgba(248, 113, 113, 0.4)', text: '#f87171' },
              spade: { bg: 'rgba(15, 20, 25, 0.4)', border: 'rgba(226, 232, 240, 0.4)', text: '#e2e8f0' },
              nt: { bg: 'rgba(59, 130, 246, 0.2)', border: 'rgba(96, 165, 250, 0.4)', text: '#60a5fa' },
              double: { bg: 'rgba(251, 146, 60, 0.2)', border: 'rgba(251, 146, 60, 0.4)', text: '#fb923c' }
            };
            return schemes[color] || schemes.gray;
          };

          const colors = getColorScheme(bid.color);

          return (
            <button
              onClick={disabled ? null : onClick}
              onMouseEnter={() => !disabled && setIsHovered(true)}
              onMouseLeave={() => setIsHovered(false)}
              disabled={disabled}
              style={{
                background: disabled 
                  ? 'rgba(255, 255, 255, 0.02)' 
                  : isHovered ? colors.bg : 'rgba(255, 255, 255, 0.05)',
                border: `2px solid ${disabled 
                  ? 'rgba(255, 255, 255, 0.05)' 
                  : isHovered ? colors.border : 'rgba(255, 255, 255, 0.1)'}`,
                borderRadius: '8px',
                padding: '12px 8px',
                color: disabled ? 'rgba(255, 255, 255, 0.2)' : colors.text,
                fontSize: '16px',
                fontWeight: '600',
                cursor: disabled ? 'not-allowed' : 'pointer',
                transition: 'all 0.2s',
                opacity: disabled ? 0.3 : 1,
                transform: isHovered && !disabled ? 'translateY(-2px)' : 'translateY(0)',
                boxShadow: isHovered && !disabled ? `0 4px 12px ${colors.border}` : 'none'
              }}
            >
              {bid.label}
            </button>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <!-- Footer -->
    <footer style="position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 1rem; text-align: center; border-top: 1px solid #334155; z-index: 1000;">

        <a href="/cdn-cgi/l/email-protection#d2b4b7b7b6b0b3b1b992a1beb3bfb0a0bbb6b5b7fcbbb7" style="color: #94a3b8; text-decoration: none; margin: 0 1rem;">Feedb
